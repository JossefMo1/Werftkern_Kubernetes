name: Native runtime source and package checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_pitr:
        description: 'Run real PG17/pgBackRest on a prequalified disposable self-hosted runner (protected environment)'
        required: false
        type: boolean
        default: false
      run_real_vm_e2e:
        description: 'Run privileged single-node install on an ephemeral Ubuntu runner'
        required: false
        type: boolean
        default: false
concurrency:
  # A delayed push check must not cancel explicitly requested VM qualification.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified release reference, 2026-09-27.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # verified release reference, 2026-09-24
        with:
          go-version: '1.27.4'
          cache: false
      - name: Compile, race tests and static checks
        run: |
          mkdir -p evidence
          set -o pipefail
          go test -race -count=1 -json ./... | tee evidence/go-test.jsonl
          go vet ./...
          python3 -m unittest discover -s tests/release -v
          python3 -m unittest discover -s tests/ops -v
          python3 -m compileall -q ops tests/integration/real_pitr.py
          go test -tags real_etcd -run '^$' ./tests/integration
          python3 scripts/check-public-source.py > evidence/public-source-check.json
          python3 scripts/check-native-production-scope.py > evidence/native-production-scope.json
          python3 scripts/check-hcloud-csi-runtime-profile.py > evidence/hcloud-csi-runtime-profile.json
          set +e
          python3 scripts/check-release.py --commit "$GITHUB_SHA" > evidence/production-blockers.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 1
          python3 -c 'import json; d=json.load(open("evidence/production-blockers.json")); assert not d["productionReady"] and d["status"]=="BLOCKED"' 
          node --check internal/dashboard/assets/app.js
          bash -n scripts/build-deb.sh tests/e2e/ubuntu-vm.sh
      - name: Check reachable Go vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          # Fixed scanner version; Go module verification authenticates downloads.
          # This covers reachable Go code, not OS packages or managed-cluster images.
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... | tee evidence/go-vulnerabilities.txt
      - name: Root-only physical-volume CLI integration with explicit test doubles
        run: |
          set -o pipefail
          sudo env PATH="$PATH" go test -race -count=1 -json ./internal/cli -run '^TestVolumeArchiveCLIPhysicalRestoreAfterLostAcknowledgment$' | tee evidence/root-volume-cli.jsonl
      - name: Check whether historical dev.3 source baseline is available
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e '67f5617188a8536d0ce915267a27ed552e55687e^{commit}' 2>/dev/null; then
            echo 'WERFT_COMPAT_BASE_AVAILABLE=true' >> "$GITHUB_ENV"
          else
            echo 'WERFT_COMPAT_BASE_AVAILABLE=false' >> "$GITHUB_ENV"
            echo '{"status":"BLOCKED","reason":"historical-dev3-commit-not-in-published-repository","previousAgentCompatibilityVerified":false,"productionReady":false}' > evidence/agent-compat-status.json
            echo '::warning::Historical dev.3 ancestor is absent: real binary compatibility and predecessor signature checks are NOT VERIFIED. Release qualification remains blocked.'
          fi
      - name: Actual previous-agent executable compatibility (explicit engine/store fixtures)
        if: env.WERFT_COMPAT_BASE_AVAILABLE == 'true'
        run: bash scripts/test-agent-compat.sh
      - name: Build unsigned experimental package (not a public release)
        run: |
          set -euo pipefail
          # Bind package timestamps and embedded build metadata to the exact
          # source commit.  Build twice to make reproducibility an executable
          # CI contract instead of a documentation-only promise.
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          SOURCE_DATE_EPOCH="$epoch" bash scripts/build-deb.sh
          first_sha="$(sha256sum dist/werftkern_0.2.0~dev4_amd64.deb | awk '{print $1}')"
          rm -rf build dist
          SOURCE_DATE_EPOCH="$epoch" bash scripts/build-deb.sh
          second_sha="$(sha256sum dist/werftkern_0.2.0~dev4_amd64.deb | awk '{print $1}')"
          test "$first_sha" = "$second_sha"
          go list -m -json all > evidence/go-modules.json
          python3 scripts/generate-native-sbom.py \
            --package dist/werftkern_0.2.0~dev4_amd64.deb \
            --modules evidence/go-modules.json \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$epoch" \
            --output evidence/native-sbom.spdx.json
          sha256sum evidence/native-sbom.spdx.json > evidence/native-sbom.sha256
          printf '%s\n' "{\"sourceCommit\":\"$GITHUB_SHA\",\"sourceDateEpoch\":$epoch,\"packageSha256\":\"$second_sha\",\"reproducible\":true}" > evidence/reproducible-build.json
      - name: Smoke-test extracted native package command wrapper
        run: |
          set -euo pipefail
          package="dist/werftkern_0.2.0~dev4_amd64.deb"
          root="$RUNNER_TEMP/werftkern-package-root"
          rm -rf "$root"
          mkdir -p "$root"
          dpkg-deb --extract "$package" "$root"
          test -x "$root/usr/bin/werft"
          test -x "$root/usr/bin/werft-ops"
          test -f "$root/usr/lib/werftkern/ops/werftops/__main__.py"
          "$root/usr/bin/werft-ops" --help > "$RUNNER_TEMP/werft-ops-help.txt"
          grep -q -- "native-bootstrap" "$RUNNER_TEMP/werft-ops-help.txt"
      - name: Smoke-test native package after apt installation
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/dist/werftkern_0.2.0~dev4_amd64.deb"
          test -f "$package"
          apt_source_backup="$(mktemp -d)"
          restore_apt_sources() {
            for backup in "$apt_source_backup"/*; do
              if [ -f "$backup" ]; then
                sudo mv "$backup" "/etc/apt/sources.list.d/$(basename "$backup")"
              fi
            done
            rmdir "$apt_source_backup" 2>/dev/null || true
          }
          disable_unavailable_optional_sources() {
            for source in /etc/apt/sources.list.d/*; do
              if [ -f "$source" ] && sudo grep -q "packages.microsoft.com" "$source"; then
                sudo mv "$source" "$apt_source_backup/$(basename "$source")"
              fi
            done
          }
          cleanup() {
            set +e
            sudo apt-get remove -y werftkern >/dev/null
            test "$(dpkg-query -W -f='${Status}' werftkern 2>/dev/null || true)" != "install ok installed"
            hash -r
            ! command -v werft-ops
            ! command -v werft
            restore_apt_sources
          }
          trap cleanup EXIT
          disable_unavailable_optional_sources
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$package"
          test "$(dpkg-query -W -f='${Status}' werftkern)" = "install ok installed"
          test "$(command -v werft-ops)" = "/usr/bin/werft-ops"
          test "$(command -v werft)" = "/usr/bin/werft"
          werft-ops --help > "$RUNNER_TEMP/werft-ops-installed-help.txt"
          grep -q -- "native-bootstrap" "$RUNNER_TEMP/werft-ops-installed-help.txt"
          werft --help > "$RUNNER_TEMP/werft-installed-help.txt"

      - name: Actual previous verifier authenticates target package (ephemeral test signature only)
        if: env.WERFT_COMPAT_BASE_AVAILABLE == 'true'
        run: python3 tests/integration/verify_upgrade_package.py --previous-binary evidence/agent-compat/werft-dev3 --package dist/werftkern_0.2.0~dev4_amd64.deb --evidence evidence/package-predecessor-check.json
      - name: Fail closed if an unavailable historical check was reported as passed
        if: env.WERFT_COMPAT_BASE_AVAILABLE == 'false'
        run: |
          python3 -c 'import json; d=json.load(open("evidence/agent-compat-status.json")); assert d["status"] == "BLOCKED" and d["previousAgentCompatibilityVerified"] is False and d["productionReady"] is False'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # verified release reference, 2026-09-27.0.2
        with:
          name: experimental-source-validation-and-deb
          path: |
            dist/
            evidence/*.jsonl
            evidence/*.json
            evidence/*.sha256
            evidence/agent-compat/*.txt
            evidence/agent-compat/*.log
  real-etcd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify and install real etcd test dependency
        run: |
          bash scripts/install-test-etcd.sh "$RUNNER_TEMP/werft-etcd"
          echo "$RUNNER_TEMP/werft-etcd" >> "$GITHUB_PATH"
      - name: Real processes, leader termination, quorum loss and restart
        run: |
          mkdir -p real-etcd-evidence
          set -o pipefail
          etcd --version | tee real-etcd-evidence/etcd-version.txt
          go test -race -count=1 -timeout 4m -tags real_etcd -json ./tests/integration | tee real-etcd-evidence/test.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: real-etcd-single-host-evidence
          path: real-etcd-evidence/
          if-no-files-found: warn
  real-vm:
    if: >-
      needs.test.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.run_real_vm_e2e) ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.2.0-rc.')))
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified release reference, 2026-09-27.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # verified release reference, 2026-09-28.0.2
        with:
          name: experimental-source-validation-and-deb
          path: artifacts
      - name: Explicit disposable-runner package qualification
        run: |
          set -euo pipefail
          package="$(find "$PWD/artifacts" -name '*.deb' -print -quit)"
          test -n "$package"
          test "$(find "$PWD/artifacts" -name '*.deb' -type f | wc -l)" -eq 1
          mkdir -p vm-evidence
          package_sha256="$(sha256sum "$package" | awk '{print $1}')"
          printf '%s\n' "{\"sourceCommit\":\"$GITHUB_SHA\",\"workflowRunId\":\"$GITHUB_RUN_ID\",\"workflow\":\"$GITHUB_WORKFLOW\",\"packageName\":\"$(basename "$package")\",\"packageSha256\":\"$package_sha256\"}" > vm-evidence/candidate-package.json
          sudo env WERFT_DISPOSABLE_VM=1 \
            WERFT_CANDIDATE_COMMIT="$GITHUB_SHA" \
            WERFT_CANDIDATE_RUN_ID="$GITHUB_RUN_ID" \
            WERFT_CANDIDATE_WORKFLOW="$GITHUB_WORKFLOW" \
            bash tests/e2e/ubuntu-vm.sh "$package"
      - name: Make only non-secret test results readable
        if: always()
        run: |
          mkdir -p vm-evidence
          # Explicit allowlist: never recursively upload /root, /etc, PKI or backups.
          for f in ubuntu-vm-result.json version.txt docker-version.txt etcd-version.txt doctor.txt; do
            if sudo test -f "/var/tmp/werftkern-e2e/$f"; then
              sudo cp "/var/tmp/werftkern-e2e/$f" vm-evidence/
            fi
          done
          test -s vm-evidence/candidate-package.json
          test -s vm-evidence/ubuntu-vm-result.json
          python3 - vm-evidence/candidate-package.json vm-evidence/ubuntu-vm-result.json <<'PY'
          import json, pathlib, sys

          expected = json.loads(pathlib.Path(sys.argv[1]).read_text())
          result = json.loads(pathlib.Path(sys.argv[2]).read_text())
          candidate = result.get("candidate", {})
          for key in ("sourceCommit", "workflowRunId", "workflow", "packageName", "packageSha256"):
              assert candidate.get(key) == expected[key], f"candidate binding mismatch: {key}"
          assert result["status"] == "passed"
          PY
          sudo chown -R "$(id -u):$(id -g)" vm-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # verified release reference, 2026-09-27.0.2
        if: always()
        with:
          name: actual-ubuntu-vm-evidence
          path: vm-evidence/
          if-no-files-found: warn

  real-pitr:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_real_pitr
    needs: test
    runs-on: [self-hosted, linux, x64, werft-pitr-disposable]
    environment: werft-isolated-database-lab
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Explicit real database integration on approved disposable host
        shell: bash
        run: |
          set -euo pipefail
          # Runner prerequisites/PG packages are preapproved, not downloaded by this job.
          # Only this temporary checkout is made accessible to postgres. No production data.
          work="$(mktemp -d /var/tmp/werft-pitr-ci-XXXXXX)"
          trap 'sudo rm -rf -- "$work"' EXIT
          git archive HEAD | tar -x -C "$work"
          sudo chown -R postgres:postgres "$work"
          mkdir -p real-pitr-evidence
          status=0
          sudo -u postgres env WERFT_DISPOSABLE_VM=1 python3 "$work/tests/integration/real_pitr.py"             --evidence "$work/result.json" || status=$?
          if sudo test -f "$work/result.json"; then
            sudo cat "$work/result.json" > real-pitr-evidence/result.json
          fi
          test "$status" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: real-pitr-single-host-evidence
          path: real-pitr-evidence/result.json
          if-no-files-found: warn
