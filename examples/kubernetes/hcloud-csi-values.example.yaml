# Candidate values for hcloud-csi 2.24.2 on k0s. Not production-qualified.
# The hcloud API token is an existing kube-system/hcloud Secret and must not be
# stored in this file or committed to Git.

controller:
  replicaCount: 2
  priorityClassName: system-cluster-critical
  podSecurityContext:
    enabled: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  image:
    csiAttacher:
      name: registry.k8s.io/sig-storage/csi-attacher@sha256:d1a26170efed45491074ca4545c81844eee2b9043fb885ac01fb4aed6f8b72d2
      tag: ""
    csiResizer:
      name: registry.k8s.io/sig-storage/csi-resizer@sha256:ea1d25e23479000c7e8eeb92d827df66258df4e482ca054c5e7ce3fc0f5c41a5
      tag: ""
    csiProvisioner:
      name: registry.k8s.io/sig-storage/csi-provisioner@sha256:a4b0b1a37605b7b04a293e136edf7006ec1786a8eb3f4e5a945f81d667dcc371
      tag: ""
    livenessProbe:
      name: registry.k8s.io/sig-storage/livenessprobe@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
      tag: ""
    hcloudCSIDriver:
      name: docker.io/hetznercloud/hcloud-csi-driver@sha256:c231060c9d24d485c8ac25eeb3dd445994ce1abb7417c5a49b88301931a9fe29
      tag: ""
  # Conservative scheduler and containment guardrails. These are not measured
  # capacity limits and still require load and soak validation before release.
  resources:
    csiAttacher:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 200m, memory: 128Mi}
    csiResizer:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 200m, memory: 128Mi}
    csiProvisioner:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 200m, memory: 128Mi}
    livenessProbe:
      requests: {cpu: 5m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
    hcloudCSIDriver:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
  podDisruptionBudget:
    create: true
    minAvailable: 1

node:
  kubeletDir: /var/lib/k0s/kubelet
  priorityClassName: system-node-critical
  # RuntimeDefault applies to the non-privileged sidecars. The privileged CSI
  # node driver remains an explicit high-trust exception requiring live tests.
  podSecurityContext:
    enabled: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  # This separately managed ServiceAccount disables automatic API-token mounts.
  serviceAccountName: werftkern-hcloud-csi-node
  image:
    csiNodeDriverRegistrar:
      name: registry.k8s.io/sig-storage/csi-node-driver-registrar@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
      tag: ""
    livenessProbe:
      name: registry.k8s.io/sig-storage/livenessprobe@sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
      tag: ""
    hcloudCSIDriver:
      name: docker.io/hetznercloud/hcloud-csi-driver@sha256:c231060c9d24d485c8ac25eeb3dd445994ce1abb7417c5a49b88301931a9fe29
      tag: ""
  # Kept separate from controller budgets so node-side load can be qualified
  # independently on the supported k0s topology.
  resources:
    csiNodeDriverRegistrar:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
    livenessProbe:
      requests: {cpu: 5m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
    hcloudCSIDriver:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

metrics:
  enabled: true

storageClasses:
  - name: werftkern-hcloud-retain
    defaultStorageClass: false
    reclaimPolicy: Retain
